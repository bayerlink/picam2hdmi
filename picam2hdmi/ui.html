<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>picam2hdmi</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 1rem; background: #0d1117; color: #e6edf3;
         font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 1.1rem; margin: 0; letter-spacing: .04em; }
  header { display: flex; gap: .8rem; align-items: baseline; flex-wrap: wrap;
           border-bottom: 1px solid #30363d; padding-bottom: .7rem; }
  #led { width: .7rem; height: .7rem; border-radius: 50%; display: inline-block;
         background: #57606a; align-self: center; }
  #led.on { background: #3fb950; } #led.err { background: #f85149; }
  #facts { color: #8b949e; font-variant-numeric: tabular-nums; }
  #err { color: #f85149; min-height: 1.3em; margin: .5rem 0;
         white-space: pre-wrap; }
  main { max-width: 64rem; }
  nav { display: flex; gap: .4rem; margin: .8rem 0 0; }
  nav button { background: #161b22; border: 1px solid #30363d;
               border-bottom: none; border-radius: 8px 8px 0 0;
               padding: .5rem 1.1rem; color: #8b949e; font: inherit;
               cursor: pointer; position: relative; }
  nav button.sel { color: #e6edf3; background: #1c2129; }
  nav button .dot { display: none; width: .5rem; height: .5rem;
                    border-radius: 50%; background: #3fb950;
                    position: absolute; top: .45rem; right: .45rem; }
  nav button.live .dot { display: inline-block; }
  .tab { display: none; background: #1c2129; border: 1px solid #30363d;
         border-radius: 0 8px 8px 8px; padding: 1rem; }
  .tab.sel { display: block; }
  label { display: inline-flex; gap: .35rem; align-items: center;
          margin: .15rem .6rem .15rem 0; color: #8b949e; }
  input, select, button { background: #0d1117; color: #e6edf3;
          border: 1px solid #30363d; border-radius: 6px;
          padding: .35rem .5rem; font: inherit; }
  input[type=number] { width: 5.4rem; }
  button { cursor: pointer; }
  button.go { background: #238636; border-color: #2ea043; font-weight: 600; }
  button.warn { color: #f85149; }
  #croparea { position: relative; background: #0d1117;
              border: 1px solid #30363d; border-radius: 6px;
              margin: .7rem 0; touch-action: none; user-select: none;
              image-rendering: pixelated;
              background-image:
                linear-gradient(#161b22 1px, transparent 1px),
                linear-gradient(90deg, #161b22 1px, transparent 1px);
              background-size: 10% 10%; }
  #wirewin { position: absolute; pointer-events: none; display: none; }
  #cropbox { position: absolute; border: 2px solid #3fb950;
             background: rgba(63, 185, 80, .12); cursor: grab;
             box-sizing: border-box; }
  #cropbox.full { border-style: dashed; }
  .handle { position: absolute; width: 14px; height: 14px;
            background: #3fb950; border-radius: 3px; margin: -7px; }
  .h-n { top: 0; left: 50%; cursor: ns-resize; }
  .h-s { top: 100%; left: 50%; cursor: ns-resize; }
  .h-w { top: 50%; left: 0; cursor: ew-resize; }
  .h-e { top: 50%; left: 100%; cursor: ew-resize; }
  .h-nw { top: 0; left: 0; cursor: nwse-resize; }
  .h-se { top: 100%; left: 100%; cursor: nwse-resize; }
  .h-ne { top: 0; left: 100%; cursor: nesw-resize; }
  .h-sw { top: 100%; left: 0; cursor: nesw-resize; }
  #cropinfo { color: #8b949e; font-variant-numeric: tabular-nums; }
  #cropinfo b { color: #e6edf3; font-weight: 600; }
  #budget.bad { color: #f85149; }
  #budget.ok { color: #3fb950; }
  #preview { width: 100%; image-rendering: pixelated; background: #000;
             border-radius: 6px; min-height: 6rem; margin-top: .4rem; }
  #previewcap { color: #8b949e; font-size: .85rem; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: .3rem .4rem; border-top: 1px solid #21262d; }
  td.name { font-family: ui-monospace, monospace; word-break: break-all; }
  #drop { border: 1px dashed #30363d; border-radius: 6px; padding: .8rem;
          text-align: center; color: #8b949e; margin-top: .6rem; }
  #drop.hot { border-color: #3fb950; color: #3fb950; }
  footer { color: #57606a; font-size: .8rem; margin-top: 1rem; }
  section.below { background: #161b22; border: 1px solid #30363d;
                  border-radius: 8px; padding: .9rem; margin-top: 1rem; }
  section.below h2 { margin: 0 0 .6rem; font-size: .8rem;
                     text-transform: uppercase; letter-spacing: .09em;
                     color: #8b949e; }
</style>

<header>
  <span id="led"></span>
  <h1>picam2hdmi</h1>
  <span id="facts">connecting…</span>
</header>
<div id="err"></div>

<main>
  <nav>
    <button id="tab-pattern" class="sel" onclick="showTab('pattern')">
      Pattern<span class="dot"></span></button>
    <button id="tab-camera" onclick="showTab('camera')">
      Camera<span class="dot"></span></button>
    <button id="tab-replay" onclick="showTab('replay')">
      Replay<span class="dot"></span></button>
    <button id="tab-off" onclick="setSource({source:'off'})">Off</button>
  </nav>

  <div class="tab sel" id="pane-pattern">
    <label>pattern <select id="pat">
      <option>counting</option><option>checker</option>
      <option>corners</option><option>gradient</option></select></label>
    <label>bayer <select id="bayer">
      <option>RGGB</option><option>GRBG</option>
      <option>GBRG</option><option>BGGR</option></select></label>
    <label>width <input id="w" type="number" value="512" step="2"></label>
    <label>height <input id="h" type="number" value="240" step="2"></label>
    <label><input id="tun" type="checkbox"> luma tunnel</label>
    <br>
    <button class="go" onclick="applyPattern()">Stream pattern</button>
  </div>

  <div class="tab" id="pane-camera">
    <label>sensor mode <select id="cmode" onchange="modeChanged()">
      <option value="1296x972">1296x972 (binned)</option>
      <option value="2592x1944">2592x1944 (full, crop to fit)</option>
      <option value="640x480">640x480</option></select></label>
    <label>exposure µs <input id="cexp" type="number" value="30000"></label>
    <label>gain <input id="cgain" type="number" step="0.1" value="4.0"></label>
    <label><input id="ctun" type="checkbox" onchange="drawCrop()"> luma tunnel</label>

    <div id="croparea">
      <div id="wirewin"></div>
      <div id="cropbox">
        <div class="handle h-n"  data-h="n"></div>
        <div class="handle h-s"  data-h="s"></div>
        <div class="handle h-w"  data-h="w"></div>
        <div class="handle h-e"  data-h="e"></div>
        <div class="handle h-nw" data-h="nw"></div>
        <div class="handle h-ne" data-h="ne"></div>
        <div class="handle h-sw" data-h="sw"></div>
        <div class="handle h-se" data-h="se"></div>
      </div>
    </div>
    <div id="cropinfo"></div>
    <div id="budget"></div>
    <br>
    <button class="go" onclick="applyCamera()">Stream camera</button>
    <button onclick="fullFrame()">Full frame</button>
  </div>

  <div class="tab" id="pane-replay">
    <table id="spool"></table>
    <div id="drop">drop a .npy recording here, or
      <input type="file" id="file" accept=".npy"></div>
  </div>

  <section class="below" id="emitwrap">
    <h2>Emitting now</h2>
    <img id="preview" alt="nothing streaming">
    <div id="previewcap"></div>
  </section>
</main>

<footer>LAN bench instrument — no login, by design. Wire format:
<a href="https://github.com/bayerlink/bayerlink" style="color:#58a6ff">bayerlink</a>.
</footer>

<script>
const $ = id => document.getElementById(id);
const err = m => $('err').textContent = m || '';

async function api(method, path, body) {
  const r = await fetch(path, {method,
    body: body === undefined ? undefined :
      (body instanceof Blob ? body : JSON.stringify(body))});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}

function showTab(name) {
  for (const t of ['pattern', 'camera', 'replay']) {
    $('tab-' + t).classList.toggle('sel', t === name);
    $('pane-' + t).classList.toggle('sel', t === name);
  }
  if (name === 'camera') drawCrop();
}

function setSource(spec) {
  err('');
  pinned = false;
  api('PUT', '/source', spec).then(refresh).catch(e => err(e.message));
}

function applyPattern() {
  setSource({source: 'pattern', pattern: $('pat').value,
    bayer: $('bayer').value, width: +$('w').value, height: +$('h').value,
    luma_tunnel: $('tun').checked});
}

/* ---------------- crop editor ------------------------------------------- */
/* The snap rules ARE the packing rules: x and w land on 4-sample group
   boundaries, y and h stay even for the CFA. The budget line applies the
   1080p rate rule (2200 slots) and the tunnel byte budget live, so the
   refusal the server would send is visible before the request exists. */

let sensor = {w: 1296, h: 972};
let crop = {x: 0, y: 0, w: 1296, h: 972};          // sensor coordinates
const GX = 4, GY = 2, MINW = 16, MINH = 16;
const SLOTS = 2200, TUNNEL_LINE_BYTES = 144 - 10;  // inner bytes, minus slack

function modeChanged() {
  const [w, h] = $('cmode').value.split('x').map(Number);
  sensor = {w, h};
  crop = {x: 0, y: 0, w, h};
  view = null;          // another mode's image would sit at wrong scale
  wire = null;
  drawCrop();
}

function fullFrame() { crop = {x: 0, y: 0, w: sensor.w, h: sensor.h};
                       drawCrop(); }

function isFull() { return crop.x === 0 && crop.y === 0 &&
                    crop.w === sensor.w && crop.h === sensor.h; }

let view = null;   // the emitted window's image, when the camera streams
let wire = null;   // WHERE that window sits, in sensor coordinates

function drawCrop() {
  const area = $('croparea');
  const width = area.clientWidth || area.offsetWidth;
  const height = Math.round(width * sensor.h / sensor.w);
  area.style.height = height + 'px';
  const scale = width / sensor.w;
  const box = $('cropbox');
  box.style.left = crop.x * scale + 'px';
  box.style.top = crop.y * scale + 'px';
  box.style.width = crop.w * scale + 'px';
  box.style.height = crop.h * scale + 'px';
  box.classList.toggle('full', isFull());
  // The live image is pinned to the window ON THE WIRE; the green box
  // is the pending selection. They coincide exactly when what you drew
  // is what is streaming -- resizing the box never scales the picture.
  const wirewin = $('wirewin');
  if (view && wire) {
    wirewin.style.display = 'block';
    wirewin.style.left = wire.x * scale + 'px';
    wirewin.style.top = wire.y * scale + 'px';
    wirewin.style.width = wire.w * scale + 'px';
    wirewin.style.height = wire.h * scale + 'px';
    wirewin.style.background = `url(${view}) 0 0 / 100% 100%`;
  } else {
    wirewin.style.display = 'none';
  }
  const applied = wire && crop.x === wire.x && crop.y === wire.y &&
                  crop.w === wire.w && crop.h === wire.h;
  box.style.background = applied ? 'transparent' : '';
  $('cropinfo').innerHTML =
    `crop <b>${crop.w}×${crop.h}</b> at <b>+${crop.x}+${crop.y}</b>` +
    (isFull() ? ' (full frame)' : '') +
    ` — sensor ${sensor.w}×${sensor.h}` +
    (wire && !applied ? ' — applies on release' : '');
  const tunnel = $('ctun').checked;
  const lineBytes = Math.ceil(crop.w * 5 / 4);
  let msg, ok;
  if (tunnel) {
    ok = lineBytes <= TUNNEL_LINE_BYTES;
    msg = ok ? `fits the luma tunnel (${lineBytes} of ${TUNNEL_LINE_BYTES} bytes/line)`
             : `too wide for the tunnel: ${lineBytes} bytes/line > ${TUNNEL_LINE_BYTES} — narrow the crop`;
  } else {
    ok = crop.w <= SLOTS;
    msg = ok ? `within the 1080p rate budget (${crop.w} of ${SLOTS} slots)`
             : `exceeds the 1080p rate budget: ${crop.w} > ${SLOTS} slots — narrow the crop`;
  }
  const budget = $('budget');
  budget.textContent = msg;
  budget.className = ok ? 'ok' : 'bad';
}

const snapX = v => Math.round(v / GX) * GX;
const snapY = v => Math.round(v / GY) * GY;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

let drag = null;
$('croparea').addEventListener('pointerdown', e => {
  const area = $('croparea');
  const scale = sensor.w / area.clientWidth;
  const handle = e.target.dataset && e.target.dataset.h;
  const inBox = e.target.id === 'cropbox' || handle;
  drag = {mode: handle || (inBox ? 'move' : 'new'),
          sx: e.clientX, sy: e.clientY, scale,
          start: {...crop}};
  if (drag.mode === 'new') {                 // draw a fresh box from here
    const rect = area.getBoundingClientRect();
    const px = snapX(clamp((e.clientX - rect.left) * scale, 0,
                           sensor.w - MINW));
    const py = snapY(clamp((e.clientY - rect.top) * scale, 0,
                           sensor.h - MINH));
    crop = {x: px, y: py, w: MINW, h: MINH};
    drag.mode = 'se'; drag.start = {...crop};
  }
  area.setPointerCapture(e.pointerId);
  e.preventDefault();
});
$('croparea').addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = (e.clientX - drag.sx) * drag.scale;
  const dy = (e.clientY - drag.sy) * drag.scale;
  const s = drag.start, m = drag.mode;
  let {x, y, w, h} = s;
  if (m === 'move') {
    x = snapX(clamp(s.x + dx, 0, sensor.w - s.w));
    y = snapY(clamp(s.y + dy, 0, sensor.h - s.h));
  } else {
    if (m.includes('e')) w = snapX(clamp(s.w + dx, MINW, sensor.w - s.x));
    if (m.includes('s')) h = snapY(clamp(s.h + dy, MINH, sensor.h - s.y));
    if (m.includes('w')) {
      x = snapX(clamp(s.x + dx, 0, s.x + s.w - MINW));
      w = s.w + (s.x - x);
    }
    if (m.includes('n')) {
      y = snapY(clamp(s.y + dy, 0, s.y + s.h - MINH));
      h = s.h + (s.y - y);
    }
  }
  crop = {x, y, w, h};
  drawCrop();
});
$('croparea').addEventListener('pointerup', () => {
  const moved = drag && wire && (crop.x !== wire.x || crop.y !== wire.y ||
                                 crop.w !== wire.w || crop.h !== wire.h);
  drag = null;
  if (moved) applyCamera();   // geometry-only: the daemon retargets live
});
$('croparea').addEventListener('pointercancel', () => drag = null);
window.addEventListener('resize', drawCrop);

function applyCamera() {
  const spec = {source: 'camera',
    cam_mode: $('cmode').value.split('x').map(Number),
    luma_tunnel: $('ctun').checked};
  if (!isFull()) spec.crop = [crop.x, crop.y, crop.w, crop.h];
  if ($('cexp').value !== '') spec.exposure_us = +$('cexp').value;
  if ($('cgain').value !== '') spec.gain = +$('cgain').value;
  setSource(spec);
}

/* ---------------- status / preview / spool ------------------------------- */

let lastSpec = '';
let seeded = false;
let pinned = false;   // a spool preview holds the section open

function fetchView(retries) {
  const img = new Image();
  img.onload = () => {
    // An image is only the wire's picture if its pixels say so: a
    // stale stash from before a crop change has the OLD dimensions,
    // and painting it would stretch the old window into the new box.
    if (wire && img.naturalWidth === wire.w
             && img.naturalHeight === wire.h) {
      view = img.src;
      drawCrop();
    } else {
      if (view) { view = null; drawCrop(); }   // bare box beats a lie
      if (wire && retries > 0)
        setTimeout(() => fetchView(retries - 1), 300);
    }
  };
  img.src = '/preview.png?' + Date.now();
}

function seedFrom(src) {   // open showing what is on the wire, once
  seeded = true;
  if (src.source === 'camera') {
    if (src.cam_mode) $('cmode').value = src.cam_mode.join('x');
    modeChanged();
    if (src.crop) crop = {x: src.crop[0], y: src.crop[1],
                          w: src.crop[2], h: src.crop[3]};
    if (src.exposure_us != null) $('cexp').value = src.exposure_us;
    if (src.gain != null) $('cgain').value = src.gain;
    $('ctun').checked = !!src.luma_tunnel;
    showTab('camera');
  } else if (src.source === 'pattern') {
    if (src.pattern) $('pat').value = src.pattern;
    if (src.bayer) $('bayer').value = src.bayer;
    if (src.width) $('w').value = src.width;
    if (src.height) $('h').value = src.height;
    $('tun').checked = !!src.luma_tunnel;
  } else if (src.source === 'file') {
    showTab('replay');
  }
}

async function refresh() {
  let s;
  try { s = await api('GET', '/status'); }
  catch (e) { err('instrument unreachable: ' + e.message); return; }
  $('led').className = s.last_error ? 'err' : (s.running ? 'on' : '');
  const src = s.source || {};
  if (!seeded) seedFrom(src);
  $('facts').textContent =
    (s.running ? `${src.source}${src.pattern ? ' ' + src.pattern : ''}` +
      `${src.file ? ' ' + src.file : ''}` +
      `${src.width ? ' ' + src.width + 'x' + src.height : ''}` +
      `${src.crop ? ' crop ' + src.crop[2] + 'x' + src.crop[3] : ''}` +
      `${src.luma_tunnel ? ' (tunnel)' : ''}` +
      `${src.mode ? ' @ ' + src.mode : ''}` : 'idle') +
    ` · ${s.frames} frames · ${Math.round(s.uptime_s)}s`;
  if (s.last_error) err(s.last_error);
  for (const t of ['pattern', 'camera'])
    $('tab-' + t).classList.toggle('live', s.running && src.source === t);
  $('tab-replay').classList.toggle('live', s.running && src.source === 'file');

  const specNow = JSON.stringify(src) + s.running;
  const live = s.running && src.source === 'camera';

  // A running camera streams INTO the editor: the emitted window's
  // image, painted at the emitted window's place. Preloaded, so the
  // poll never paints a half-loaded image. The separate emitting-now
  // view would duplicate it, so it steps aside while the camera runs.
  $('emitwrap').style.display = (live && !pinned) ? 'none' : '';
  const modeMatches = live && (src.cam_mode || [sensor.w, sensor.h])
                        .join('x') === $('cmode').value;
  if (modeMatches) {
    wire = src.crop ? {x: src.crop[0], y: src.crop[1],
                       w: src.crop[2], h: src.crop[3]}
                    : {x: 0, y: 0, w: sensor.w, h: sensor.h};
    fetchView(1);
  } else if (view || wire) {
    view = null;
    wire = null;
    drawCrop();
  }
  if (!live && specNow !== lastSpec) {
    lastSpec = specNow;
    $('preview').src = s.running ? '/preview.png?' + Date.now() : '';
    $('previewcap').textContent = s.running ?
      'decoded raw samples of the emitted container' : 'nothing streaming';
  }
  renderSpool(s.spool, src.file);
}

function renderSpool(names, active) {
  const rows = names.map(n => `<tr>
    <td class="name">${n}${n === active ? ' ▶' : ''}</td>
    <td><button class="go" onclick='setSource({source:"file",file:"${n}"})'>Replay</button></td>
    <td><a href="/recordings/${n}" download><button>Download</button></a></td>
    <td><button onclick="previewOf('${n}')">Preview</button></td>
    <td><button class="warn" onclick="del('${n}')">Delete</button></td>
  </tr>`);
  $('spool').innerHTML =
    rows.join('') || '<tr><td class="name">spool is empty</td></tr>';
}

function previewOf(name) {
  pinned = true;                       // keep the section visible for it
  $('emitwrap').style.display = '';
  $('preview').src = '/preview.png?recording=' +
    encodeURIComponent(name) + '&' + Date.now();
  $('previewcap').textContent =
    'first frame of ' + name + ' (not what is streaming)';
  lastSpec = '';
}

function del(name) {
  err('');
  api('DELETE', '/recordings/' + name).then(refresh).catch(e => err(e.message));
}

async function upload(file) {
  err('');
  if (!file.name.endsWith('.npy')) { err('recordings are .npy files'); return; }
  try {
    await api('PUT', '/recordings/' + encodeURIComponent(file.name), file);
    refresh();
  } catch (e) { err(e.message); }
}

const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault();
                                         drop.classList.add('hot'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hot'));
drop.addEventListener('drop', e => { e.preventDefault();
  drop.classList.remove('hot');
  for (const f of e.dataTransfer.files) upload(f); });
$('file').addEventListener('change',
  e => { for (const f of e.target.files) upload(f); });

drawCrop();
refresh();
setInterval(refresh, 1500);
</script>
