# The protocol and patterns run anywhere, so they are tested everywhere pushes
# land. The Pi-only paths (KMS scanout, Picamera2 capture) are hardware and are
# proven on hardware, not mocked here into a green light that means nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Dependency licences are permissive
        # An ALLOW-LIST, checked against the resolved environment. A deny-list
        # only catches the licences somebody thought to name; the one that
        # causes trouble is the one nobody anticipated, and an allow-list
        # catches that by construction.
        #
        # A new dependency under an unlisted licence fails here. If the licence
        # is genuinely permissive, add it to PERMITTED with a one-line reason.
        # The full dependency audit lives in revela's docs/THIRD-PARTY.md,
        # which covers this package transitively.
        run: |
          python - <<'PY'
          import re, sys
          from importlib.metadata import distributions

          PERMITTED = {
              "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause", "0BSD",
              "Apache-2.0", "PSF-2.0", "ISC", "Zlib", "CC0-1.0", "HPND",
              "Python-2.0", "Unlicense", "MPL-2.0",
          }
          # MPL-2.0 is permitted only where it appears: a build-time transitive
          # of the build backend, never imported, never redistributed in the
          # wheel.

          def terms(expression):
              """The identifiers an SPDX expression names.

              Split on AND/OR only: `WITH` binds an exception to its licence
              ("Apache-2.0 WITH SHL-2.1") and the pair is one identifier.
              Every branch of an OR must be permitted, which is stricter than
              SPDX requires and is the right way round for this check.
              """
              parts = re.split(r"\s+(?:AND|OR)\s+|[()]", expression)
              return {p.strip() for p in parts if p.strip()}

          # Three metadata generations are in the wild at once, so all three are
          # read: the PEP 639 `License-Expression`, the `License ::` trove
          # classifiers, and the legacy free-text `License` field. A package
          # that declares its licence only in the oldest form is not an
          # undeclared package, and reporting it as one would train everyone to
          # ignore this check.
          LEGACY = {
              "mit": "MIT", "mit license": "MIT", "expat": "MIT",
              "bsd": "BSD-3-Clause", "bsd license": "BSD-3-Clause",
              "bsd-3-clause": "BSD-3-Clause", "bsd 3-clause": "BSD-3-Clause",
              "bsd-2-clause": "BSD-2-Clause", "apache-2.0": "Apache-2.0",
              "apache 2.0": "Apache-2.0", "apache software license": "Apache-2.0",
              "isc": "ISC", "psf-2.0": "PSF-2.0", "mpl-2.0": "MPL-2.0",
          }
          CLASSIFIER = {
              "MIT License": "MIT", "MIT No Attribution License (MIT-0)": "MIT-0",
              "BSD License": "BSD-3-Clause",
              "Apache Software License": "Apache-2.0",
              "Python Software Foundation License": "PSF-2.0",
              "Mozilla Public License 2.0 (MPL 2.0)": "MPL-2.0",
              "ISC License (ISCL)": "ISC", "The Unlicense (Unlicense)": "Unlicense",
              "Zope Public License": None,
          }

          def declared(dist):
              """(identifiers, how it was declared) for one distribution."""
              expression = (dist.metadata.get("License-Expression") or "").strip()
              if expression:
                  return terms(expression), expression
              classifiers = [c for c in dist.metadata.get_all("Classifier") or []
                             if c.startswith("License ::")]
              if classifiers:
                  names = [c.rsplit(" :: ", 1)[-1] for c in classifiers]
                  return ({CLASSIFIER.get(n, n) for n in names},
                          "classifier: " + "; ".join(names))
              legacy = (dist.metadata.get("License") or "").strip()
              if legacy and "\n" not in legacy and len(legacy) < 60:
                  return ({LEGACY.get(legacy.lower(), legacy)},
                          f"legacy License field: {legacy}")
              return set(), "no declared licence"

          # setuptools 78/79 dropped its `License ::` classifiers, and its
          # metadata predates `License-Expression`, so it declares its licence
          # in none of the three places read above. It is MIT; it is a build
          # tool, never imported and never redistributed in a wheel; and pip
          # brings it whether or not anything asked. Named here rather than
          # waved through: anything ELSE that declares nothing still fails.
          UNDECLARED_UPSTREAM = {"setuptools": "MIT"}

          problems, checked = [], 0
          for dist in distributions():
              name = dist.metadata["Name"]
              if not name:
                  continue
              identifiers, how = declared(dist)
              if not identifiers and name.lower() in UNDECLARED_UPSTREAM:
                  identifiers = {UNDECLARED_UPSTREAM[name.lower()]}
                  how = "known upstream packaging gap"
              checked += 1
              if not identifiers:
                  problems.append(f"{name} {dist.version}: no declared licence")
                  continue
              unlisted = identifiers - PERMITTED
              if unlisted:
                  problems.append(f"{name} {dist.version}: {how} "
                                  f"-> not permitted: {sorted(unlisted)}")

          print(f"checked {checked} distributions against the allow-list")
          if problems:
              print("\nNOT PERMITTED:")
              for p in problems:
                  print("  " + p)
              print("\nA dependency whose licence is not on the allow-list "
                    "cannot be added without a decision.")
              sys.exit(1)
          print("every dependency licence is on the allow-list")
          PY

      - run: pytest -q
      - name: The CLI produces a container that decodes
        run: |
          picam2hdmi pattern --mode corners --width 64 --height 32 \
            --display 64x40 --out /tmp/frame.npy
